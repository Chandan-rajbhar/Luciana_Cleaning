<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Luciana Cleaning Services</title>
    <link rel="icon" type="image/png" href="/images/luciana-logo.png" />
    <link rel="apple-touch-icon" href="/images/luciana-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        function updateAppH() {
          var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          if (h) {
            document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
          }
        }
        updateAppH();
        window.addEventListener('resize', updateAppH);
        window.addEventListener('orientationchange', updateAppH);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppH);
          window.visualViewport.addEventListener('scroll', updateAppH);
        }
      })();
    </script>
  </head>
  <body class="text-[#121A2B] antialiased selection:bg-[#EF5A78] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
